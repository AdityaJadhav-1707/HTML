<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tables</title>

    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: #f9f9f9;
        margin: 40px;
        color: #333;
      }

      h1 {
        text-align: center;
        color: #2c3e50;
      }

      table {
        width: 60%;
        margin: 30px auto;
        border-collapse: collapse;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        background-color: #fff;
      }

      th,
      td {
        padding: 12px 15px;
        text-align: left;
        border-bottom: 1px solid #ddd;
      }

      thead {
        background-color: #3498db;
        color: white;
      }

      tbody tr:hover {
        background-color: #f1f1f1;
        cursor: pointer;
      }

      tbody tr:nth-child(even) {
        background-color: #f9f9f9;
      }
    </style>
  </head>
  <body>
    <h1>Tables in HTML</h1>
    <table>
      <!-- Head of the Table -->
      <thead>
        <tr>
          <th>Name</th>
          <th>Role</th>
          <th>Salary</th>
        </tr>
      </thead>

      <!-- Body of the Table -->
      <tbody>
        <tr>
          <td>AJ</td>
          <td>SDE</td>
          <td>70000</td>
        </tr>
        <tr>
          <td>MH</td>
          <td>SDE</td>
          <td>80000</td>
        </tr>
        <tr>
          <td>RT</td>
          <td>SRE</td>
          <td>90000</td>
        </tr>
        <tr>
          <td colspan="3">Thank You</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
