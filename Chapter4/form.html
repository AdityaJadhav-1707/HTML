<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML Forms</title>

    <style>
      /* General Page Styling */
      body {
        font-family: "Poppins", sans-serif;
        background: linear-gradient(135deg, #74b9ff, #a29bfe);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }

      h1 {
        text-align: center;
        color: #2d3436;
        margin-bottom: 25px;
      }

      /* Form Container */
      form {
        background-color: #fff;
        padding: 30px 40px;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 450px;
      }

      form div {
        margin-bottom: 18px;
      }

      label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
        color: #2d3436;
      }

      input[type="text"],
      input[type="tel"],
      input[type="email"],
      input[type="password"],
      input[type="date"],
      select,
      textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1.5px solid #dfe6e9;
        border-radius: 8px;
        font-size: 15px;
        transition: all 0.3s ease;
      }

      input:focus,
      select:focus,
      textarea:focus {
        border-color: #0984e3;
        outline: none;
        box-shadow: 0 0 6px rgba(9, 132, 227, 0.4);
      }

      /* Radio buttons and checkboxes */
      input[type="radio"],
      input[type="checkbox"] {
        margin-right: 8px;
        transform: scale(1.2);
      }

      p {
        font-weight: 600;
        margin-bottom: 6px;
        color: #2d3436;
      }

      /* Button Styling */
      button {
        width: 100%;
        background-color: #0984e3;
        color: white;
        font-size: 16px;
        padding: 12px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      button:hover {
        background-color: #74b9ff;
        transform: scale(1.03);
      }

      /* Comments Box */
      textarea {
        resize: none;
      }

      /* Responsive Design */
      @media (max-width: 500px) {
        form {
          padding: 25px 20px;
        }
      }
    </style>
  </head>
  <body>
   
    <!-- form starts here -->
    <form action="/submit.php">
      <div>
        <label for="name">Name</label>
        <input id="name" type="text" placeholder="Enter Name" required />
      </div>

      <!-- Phone input -->
      <div>
        <label for="ph">Phone</label>
        <input id="ph" type="tel" placeholder="Enter Phone" required />
      </div>

      <!-- Email input -->
      <div>
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="Enter Email" required />
      </div>

      <!-- Password input -->
      <div>
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          placeholder="Enter Password"
          required
        />
      </div>

      <!-- Date input -->
      <div>
        <label for="dob">Date of Birth</label>
        <input id="dob" type="date" required />
      </div>

      <!-- Dropdown (select input) for Gender -->
      <div>
        <label for="gender">Gender</label>
        <select id="gender" required>
          <option value="" disabled selected>Select Gender</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
        </select>
      </div>

      <!-- Radio button for Subscription Plan -->
      <div>
        <p>Subscription Plan</p>
        <input id="basic" type="radio" name="subscription" value="basic" />
        <label for="basic">Basic</label>

        <input id="premium" type="radio" name="subscription" value="premium" />
        <label for="premium">Premium</label>

        <input id="vip" type="radio" name="subscription" value="vip" />
        <label for="vip">VIP</label>
      </div>

      <!-- Checkbox for agreeing for terms -->
      <div>
        <input id="terms" type="checkbox" required />
        <label for="terms">I agree to the terms and conditions</label>
      </div>

      <!-- Textarea for Comments -->
      <div>
        <label for="comments">Comments</label>
        <textarea
          id="comments"
          placeholder="Enter your comments"
          rows="4"
        ></textarea>
      </div>

      <!-- Submit button -->
      <div>
        <button type="submit">Submit</button>
      </div>
    </form>
    <!-- Forms ends here -->
  </body>
</html>
