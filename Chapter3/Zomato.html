<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@ Zomato - Food Any Time</title>
    <style>
      /* ======== Global Styles ======== */
      body {
        margin: 0;
        font-family: "Poppins", Arial, sans-serif;
        background-color: #170c0c; /* Deep dark red background */
        color: #f5f5f5; /* Light text for contrast */
      }

      /* ======== Header ======== */
      header {
        background-color: #f30404; /* Dark red */
        padding: 15px 30px;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        box-shadow: 0 2px 5px rgba(255, 0, 0, 0.2);
      }

      header div a {
        color: #ece6e6;
        text-decoration: none;
        margin-left: 20px;
        font-weight: 500;
        transition: color 0.3s ease, border-bottom 0.3s ease;
      }

      header div a:hover {
        color: #e54646;
        border-bottom: 2px solid #bea8a8;
      }

      /* ======== Main Section ======== */
      main {
        text-align: center;
        padding: 80px 20px;
      }

      main div {
        font-size: 2rem;
        font-weight: bold;
        color: #cd0303;
        margin-bottom: 20px;
      }

      main p {
        max-width: 700px;
        margin: 0 auto;
        line-height: 1.6;
        color: #c6bfbf;
      }

      /* ======== Footer ======== */
      footer {
        text-align: center;
        background-color: #f00a0a;
        padding: 15px;
        font-size: 0.9rem;
        color: #ddd;
        border-top: 1px solid #070101;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <a href="/home">Home</a>
        <a href="/about">About</a>
        <a href="/contact">Contact</a>
      </div>
    </header>

    <main>
      <div>Order Food Anytime, Anywhere!</div>
      <p>
        For over a decade, we’ve enabled our customers to discover new tastes,
        delivered right to their doorstep Our app is packed with features that
        enable you to experience food delivery like never before
      </p>
    </main>
    <footer>All Rights Reserved ! &copy;</footer>
  </body>
</html>
